
services:
  unisearch-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: unisearch_ai
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    # Giới hạn RAM nếu deploy trên VPS nhỏ để tránh crash do OOM (Out Of Memory)
    deploy:
      resources:
        limits:
          memory: 1.5G
