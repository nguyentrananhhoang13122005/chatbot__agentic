# ============================================================
# UniSearch AI — CI Pipeline
# ============================================================
name: Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/test.yml'

jobs:
  # 1. LINTER: Kiểm tra lỗi cú pháp và lỗi logic cơ bản (rất cần thiết với Python)
  linter:
    name: Code Linter (Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Install Linter
        run: pip install flake8
        
      - name: 🔍 Run Flake8 (Syntax & Fatal Errors only)
        # Chỉ check các lỗi nghiêm trọng gây crash app (syntax error, biến chưa khai báo, thiếu import...)
        # Bỏ qua các lỗi về format khoảng trắng/dài dòng để tránh gây khó chịu cho team.
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # 2. SECURITY: Quét bảo mật tự động (rất cần thiết khi làm Chatbot có nhận file upload/API)
  security-scan:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Bandit
        run: pip install bandit

      - name: 🛡️ Run Bandit
        # Quét lỗ hổng bảo mật cấp độ Trung bình (Medium) & Cao (High)
        # Bỏ qua thư mục tests và các thư mục cấu hình tooling (.agent, .cursor)
        run: bandit -r . -x ./tests,./.agent,./.cursor -ll

  # 3. DEPENDENCY CHECK: Quét các thư viện bị dính lỗi bảo mật (CVE)
  dependency-check:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install pip-audit
        run: pip install pip-audit

      - name: 🛡️ Run pip-audit
        # Quét file requirements.txt xem có thư viện nào dính mã độc không
        run: pip-audit -r requirements.txt

  # 3. UNIT TESTS: Kiểm tra thuật toán (Đã có sẵn)
  unit-tests:
    name: Unit Tests (Offline)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    env:
      OPENROUTER_API_KEY: "dummy_key_for_testing_only"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🧪 Run unit tests
        run: |
          python -m pytest tests/test_matcher.py -v --tb=short

      - name: 📊 Run tests with coverage
        run: |
          python -m pytest tests/test_matcher.py \
            --cov=agents \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v --tb=short

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
