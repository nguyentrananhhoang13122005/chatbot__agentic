# ============================================================
# UniSearch AI — Frontend CI Pipeline
# ============================================================
name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build-and-lint:
    name: Build & Lint (Next.js)
    runs-on: ubuntu-latest
    
    # Thiết lập thư mục làm việc mặc định cho job này là frontend/
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run Linter (ESLint)
        run: npm run lint

      - name: 🏗️ Run Build Test
        run: npm run build
